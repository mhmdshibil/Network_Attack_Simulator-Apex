server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # ── Cache: hashed assets (JS/CSS bundles with content hash in filename) ─
    # Vite appends a content hash to every chunk, so these files are immutable.
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options            "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options     "nosniff"                       always;
    }

    # ── Cache: index.html must never be cached ───────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options            "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options     "nosniff"                       always;
        add_header X-XSS-Protection           "1; mode=block"                 always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    }

    # ── SPA fallback — all routes serve index.html ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
