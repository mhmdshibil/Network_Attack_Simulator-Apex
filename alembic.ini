# Alembic configuration for Apex-Kinetics (Phase 2).
# The database URL is NOT set here — env.py reads it from the DATABASE_URL
# environment variable (falling back to the app default), so migrations use the
# same connection string as the running application.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is injected by env.py from $DATABASE_URL

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
