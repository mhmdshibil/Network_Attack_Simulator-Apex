# Certificate generator for Wazuh indexer
# Run once before starting the wazuh profile:
#   docker-compose -f wazuh/generate-indexer-certs.yml run --rm generator
#
# Generates SSL certs into wazuh/config/wazuh_indexer_ssl_certs/
# Official image: wazuh/wazuh-certs-generator:0.0.2

version: "3.9"

services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
